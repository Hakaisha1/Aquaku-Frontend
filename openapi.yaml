        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [RESOLVED, DISMISSED] }
                review_note: { type: string, minLength: 1, maxLength: 500 }
              required: [decision, review_note]
      responses:
        '201':
          description: Laporan ditinjau dan dicatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/admin/listings/{listingId}/moderation:
    get:
      description: Hanya admin; riwayat hide/restore listing.
      parameters:
        - { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
