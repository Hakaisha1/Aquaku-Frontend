      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            description: { type: [string, 'null'] }
            verification_status: { type: string, enum: [unverified, pending, verified, rejected] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
          required: [id, name, description, verification_status, created_at, updated_at]
      required: [data]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
  responses:
    BadRequest:
      description: Request tidak valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Autentikasi diperlukan
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Akses ditolak
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource tidak ditemukan
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Request bertentangan dengan kondisi saat ini
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Media provider tidak tersedia
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
