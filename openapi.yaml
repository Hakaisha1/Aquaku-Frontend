openapi: 3.1.0
info:
  title: Aquaku Backend API
  version: 0.6.0
  description: REST API akun, marketplace, forum, membership, transaksi, rating, dan moderasi Aquaku.
servers:
  - url: https://aquaku-backend-staging.up.railway.app/api/v1
    description: Railway staging (default for Bruno)
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      summary: Check application liveness
      description: Confirms the API process is running without checking database connectivity.
      responses:
        '200':
          description: Application process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, const: ok }
                    required: [status]
                required: [data]
  /health/ready:
    get:
      security: []
      summary: Check application and database readiness
      description: Checks PostgreSQL and MongoDB connectivity. Both databases must be available for the service to be ready.
      responses:
        '200':
          description: Application and required databases are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, const: ready }
                      checks:
                        type: object
                        properties:
                          database: { type: string, const: up }
                          forum_database: { type: string, const: up }
                        required: [database, forum_database]
                    required: [status, checks]
                required: [data]
        '503':
          description: One or more required databases are unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/register:
    post:
      security: []
      summary: Register an account and request phone verification
      description: Meminta OTP WhatsApp outbound melalui OTP.ID jika OTP_ID_API_KEY dikonfigurasi pada backend. Kode OTP tidak dikembalikan dalam response. development_otp hanya tersedia bila key tidak dikonfigurasi dan APP_ENV development/test; production memerlukan OTP_ID_API_KEY. Jangan pernah mengekspos API key ke client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 1, maxLength: 80 }
                phone_number: { type: string, minLength: 8, maxLength: 24 }
              required: [email, password, display_name, phone_number]
      responses:
        '201':
          description: Akun dibuat dan OTP diminta. development_otp hanya tersedia tanpa OTP_ID_API_KEY pada APP_ENV development/test; jika OTP.ID aktif, kode dikirim melalui WhatsApp dan tidak dikembalikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Batas pengiriman OTP/provider tercapai; tunggu sebelum mencoba kembali }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/login:
    post:
      security: []
      summary: Log in and issue access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 1, maxLength: 128 }
              required: [email, password]
      responses:
        '200':
          description: Token dan profil pengguna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      security: []
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, minLength: 1, maxLength: 4096 }
              required: [refresh_token]
      responses:
        '200':
          description: Token baru dan profil pengguna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/verify-phone:
    post:
      summary: Verify a phone number with a six-digit OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
              required: [code]
      responses:
        '200':
          description: Nomor HP terverifikasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Batas percobaan OTP/provider tercapai; tunggu sebelum mencoba kembali }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/otp/resend:
    post:
      summary: Resend an OTP
      responses:
        '200':
          description: OTP diminta; jika OTP_ID_API_KEY aktif, kode dikirim melalui WhatsApp dan tidak dikembalikan. development_otp hanya tersedia tanpa key pada APP_ENV development/test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpResendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Cooldown resend atau batas pengiriman OTP/provider tercapai }
        '503': { $ref: '#/components/responses/Unavailable' }
  /users/me:
    get:
      summary: Get your own profile
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update your own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
                avatar_url: { type: string, format: uri, maxLength: 2048 }
                whatsapp_number: { type: string, maxLength: 24 }
                bio: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Profil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/regions:
    get:
      security: []
      summary: List Semarang City urban villages
      responses:
        '200':
          description: Daftar wilayah yang dapat dipakai pada listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Region' }
                required: [data]
  /marketplace/taxonomy:
    get:
      security: []
      summary: List categories and condition tags
      responses:
        '200':
          description: Taksonomi listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
                      tags:
                        type: array
                        items: { $ref: '#/components/schemas/Tag' }
                    required: [categories, tags]
                required: [data]
  /marketplace/listings:
    get:
      security: []
      summary: Search active listings
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 64 } }
        - { name: condition, in: query, schema: { $ref: '#/components/schemas/Condition' } }
        - { name: min_price, in: query, schema: { type: integer, minimum: 1 } }
        - { name: max_price, in: query, schema: { type: integer, minimum: 1 } }
        - { name: region_code, in: query, schema: { type: string, maxLength: 32 } }
        - { name: district_code, in: query, schema: { type: string, maxLength: 16 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Hasil pencarian
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPage' }
    post:
      summary: Create an active listing
      description: Memerlukan access token, HP terverifikasi, slot kuota, dan foto terverifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListing' }
      responses:
        '201': { description: Listing dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/listings/{listingId}:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    get:
      security: []
      summary: Get active listing details
      responses:
        '200': { description: Detail listing, content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update your active listing
      description: photo_ids tidak melepas foto yang sudah terpasang. Hapus foto lama melalui DELETE /marketplace/media/{assetId} agar file Cloudinary ikut dihapus.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListing' }
      responses:
        '200': { description: Listing diperbarui, content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete your active or inactive listing
      responses:
        '200': { description: Listing diarsipkan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/listings/{listingId}/sold:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      summary: Mark a listing as sold and optionally link a verified buyer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string, format: uuid, description: Jika kosong, penjualan tidak bisa diberi rating }
      responses:
        '201':
          description: Listing ditandai terjual; jika buyer_id diberikan, menunggu konfirmasi pembeli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkSoldResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/listings/{listingId}/sale:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      summary: Link or update the buyer before confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id: { type: string, format: uuid }
              required: [buyer_id]
      responses:
        '201':
          description: Transaksi menunggu konfirmasi pembeli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/sales/{saleId}:
    delete:
      summary: Cancel a transaction link before the buyer responds
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transaksi dibatalkan; listing tetap terjual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransactionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/sales/{saleId}/respond:
    post:
      summary: Accept or reject a transaction as the buyer
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [CONFIRM, REJECT] }
                note: { type: string, maxLength: 500 }
              required: [decision]
      responses:
        '201':
          description: Respons pembeli tersimpan; penolakan tidak mengaktifkan listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransactionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/sales/{saleId}/rating:
    post:
      summary: Rate a confirmed transaction from 1 to 5
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
              required: [score]
      responses:
        '201':
          description: Rating tersimpan; satu rating per transaksi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/listings/{listingId}/renew:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      summary: Renew your expired listing
      responses:
        '201': { description: Listing diaktifkan kembali, content: { application/json: { schema: { $ref: '#/components/schemas/ListingResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/listings:
    get:
      summary: List your own listings
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Listing milik sendiri termasuk status Sold, Expired, dan Inactive, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/listings/{listingId}/reactivate:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    post:
      summary: Reactivate a system-deactivated listing
      description: Memerlukan hak tier, kuota, dan cooldown yang sesuai; sisa masa tayang dilanjutkan.
      responses:
        '201': { description: Listing diaktifkan kembali }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/membership/plans:
    get:
      security: []
      summary: List paid membership plans
      responses:
        '200':
          description: Paket Toko dan Juragan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MembershipPlan' }
                required: [data]
  /marketplace/me/membership-requests:
    post:
      summary: Request membership or an upgrade
      description: Transfer manual. Bukti JPEG/PNG/PDF maksimal 5 MB disimpan privat; harga harus sesuai paket.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                tier: { type: string, enum: [TOKO, JURAGAN] }
                payment_amount: { type: integer, minimum: 1 }
                proof: { type: string, format: binary }
              required: [tier, payment_amount, proof]
      responses:
        '201': { description: Pengajuan menunggu review admin }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/addon-requests:
    post:
      summary: Request additional slots or a cooldown bypass
      description: Harga add-on belum ditetapkan oleh sistem; admin memeriksa nominal transfer dan menetapkan jumlah slot yang disetujui.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [SLOT_ADDON, COOLDOWN_BYPASS] }
                payment_amount: { type: integer, minimum: 1 }
                slots: { type: integer, minimum: 1, maximum: 1000, description: Wajib untuk SLOT_ADDON }
                proof: { type: string, format: binary }
              required: [kind, payment_amount, proof]
      responses:
        '201': { description: Pengajuan menunggu review admin }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/shops/verification-requests:
    post:
      summary: Request manual shop verification
      description: Verifikasi toko memberi badge dan tidak menjadi syarat hak membership.
      responses:
        '201': { description: Pengajuan verifikasi toko }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/benefit-requests:
    get:
      summary: List your membership, add-on, and shop verification requests
      responses:
        '200': { description: Riwayat pengajuan milik sendiri; bukti transfer tidak disertakan }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/me/entitlements:
    get:
      summary: Get membership, add-on, cooldown pass, and shop verification entitlements
      responses:
        '200': { description: Hak akun saat ini }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/admin/benefit-requests:
    get:
      description: Hanya admin. Maksimal 100 pengajuan per respons.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200': { description: Daftar pengajuan tanpa isi bukti transfer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marketplace/admin/benefit-requests/{requestId}/proof:
    get:
      description: Hanya admin; mengunduh bukti secara privat dengan cache dinonaktifkan.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: JPEG, PNG, atau PDF bukti transfer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/admin/benefit-requests/{requestId}/review:
    post:
      description: Hanya admin. Keputusan final idempoten; penolakan wajib menyertakan alasan.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                review_note: { type: string, maxLength: 500 }
                approved_slots: { type: integer, minimum: 1, maximum: 1000, description: Jumlah final untuk pengajuan SLOT_ADDON }
              required: [decision]
      responses:
        '200': { description: Pengajuan ditinjau dan audit tersimpan }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/sales:
    get:
      summary: List your sales
      responses:
        '200':
          description: Maksimal 100 transaksi terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransactionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/me/purchases:
    get:
      summary: List your purchases
      responses:
        '200':
          description: Maksimal 100 transaksi terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransactionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/reports:
    post:
      summary: Report a listing or user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_type: { type: string, enum: [LISTING, USER] }
                target_id: { type: string, format: uuid }
                reason: { $ref: '#/components/schemas/ReportReason' }
                details: { type: string, maxLength: 1000 }
              required: [target_type, target_id, reason]
      responses:
        '201':
          description: Laporan masuk antrean admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/me/reports:
    get:
      summary: List reports you submitted
      responses:
        '200':
          description: Maksimal 100 laporan terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /marketplace/admin/reports:
    get:
      description: Hanya admin; laporan pengguna/listing, maksimal 100 per respons.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED, DISMISSED] } }
      responses:
        '200':
          description: Antrean laporan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marketplace/admin/reports/{reportId}/review:
    post:
      description: Hanya admin; tidak otomatis menangguhkan akun pengguna.
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
