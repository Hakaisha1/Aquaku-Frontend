      responses:
        '201':
          description: Tindakan moderasi tercatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /marketplace/admin/sales/{saleId}/corrections:
    get:
      description: Hanya admin; audit koreksi pembeli.
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Riwayat koreksi transaksi
