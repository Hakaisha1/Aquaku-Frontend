            application/json:
              schema: { $ref: '#/components/schemas/SaleCorrectionsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marketplace/admin/sales/{saleId}/correct-buyer:
    post:
      description: Hanya admin; mengoreksi pembeli transaksi terkonfirmasi, menghapus rating lama, lalu meminta konfirmasi pembeli baru.
      parameters:
        - { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
