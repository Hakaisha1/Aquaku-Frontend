        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ForumCategory:
      type: object
      properties:
        id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
      required: [id, name, slug, description]
    ForumCategoryResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/ForumCategory' } }
      required: [data]
    ForumAuthor:
      type: [object, 'null']
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
      required: [id, display_name, avatar_url]
    ForumPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
      required: [id, url]
    ForumMediaAssetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            url: { type: [string, 'null'], format: uri }
            format: { type: [string, 'null'] }
            bytes: { type: [integer, 'null'] }
            uploaded_at: { type: [string, 'null'], format: date-time }
          required: [id, url, format, bytes, uploaded_at]
      required: [data]
    ForumPost:
      type: object
      properties:
        id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [published, hidden, deleted] }
        category: { anyOf: [{ $ref: '#/components/schemas/ForumCategory' }, { type: 'null' }] }
        author: { $ref: '#/components/schemas/ForumAuthor' }
        photos: { type: array, items: { $ref: '#/components/schemas/ForumPhoto' } }
        comments_count: { type: integer }
        reports_count: { type: integer }
        moderation_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, title, body, status, category, author, photos, comments_count, reports_count, moderation_reason, created_at, updated_at]
    ForumPostResponse:
      type: object
      properties: { data: { $ref: '#/components/schemas/ForumPost' } }
      required: [data]
    ForumPostPageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
