        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        price: { type: integer, minimum: 1, maximum: 2147483647 }
        condition: { $ref: '#/components/schemas/Condition' }
        photo_ids:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, format: uuid }
        cooldown_pass_id: { type: string, format: uuid, description: Opsional; dikonsumsi hanya jika listing berhasil dibuat saat cooldown aktif }
      required: [category_id, region_code, title, description, price, condition, photo_ids]
