        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Halaman antrean moderasi, content: { application/json: { schema: { $ref: '#/components/schemas/ForumPostPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /forum/admin/posts/{postId}/moderation:
