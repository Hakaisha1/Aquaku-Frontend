      type: object
      properties:
        category_id: { type: string, format: uuid }
        region_code: { type: string, maxLength: 32 }
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        price: { type: integer, minimum: 1, maximum: 2147483647 }
        condition: { $ref: '#/components/schemas/Condition' }
        photo_ids:
          type: array
          description: Jika diberikan, sertakan foto yang sudah terpasang dan foto terverifikasi yang ingin ditambahkan. Hapus foto lama melalui endpoint DELETE media.
          minItems: 1
          maxItems: 8
          items: { type: string, format: uuid }
